<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartelera Showcase • Horarios Oficiales</title>
  
  <meta name="description" content="Cartelera completa y actualizada de cines Showcase en Argentina (Belgrano, Norcenter, IMAX, Haedo, Quilmes, Córdoba y Rosario). Funciones, horarios y trailers.">
  <meta name="keywords" content="Cartelera Showcase, cines showcase, showcase belgrano, showcase norcenter, imax norcenter, showcase haedo, showcase quilmes, showcase cordoba, showcase rosario, horarios showcase">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="googlebot" content="index, follow">
  <meta name="google-site-verification" content="ze96hPU_sQkGJwy8t8Wntyobav6KGhoneHQ6N9ybhbE" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://cartelerashowcase.vercel.app/">
  
  <!-- Web App & PWA -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070e1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cartelera Showcase">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  
  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cartelera Showcase">
  <meta property="og:title" content="Cartelera Showcase • Horarios Oficiales">
  <meta property="og:description" content="Consultá la cartelera de Showcase (Belgrano, Norcenter, IMAX, Haedo, Quilmes, Córdoba, Rosario) en tiempo real con horarios oficiales y trailers.">
  <meta property="og:url" content="https://cartelerashowcase.vercel.app/">
  <meta property="og:image" content="https://cartelerashowcase.vercel.app/icon.svg">
  <meta property="og:locale" content="es_AR">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Cartelera Showcase • Horarios Oficiales">
  <meta name="twitter:description" content="Cartelera completa y actualizada de todos los cines Showcase en Argentina.">
  <meta name="twitter:image" content="https://cartelerashowcase.vercel.app/icon.svg">

  <!-- Performance & Preconnect Hints -->
  <link rel="preconnect" href="https://static.voyalcine.net" crossorigin>
  <link rel="dns-prefetch" href="https://static.voyalcine.net">
  <link rel="preconnect" href="https://api.voyalcine.net" crossorigin>
  <link rel="dns-prefetch" href="https://api.voyalcine.net">

  <!-- Clean, Zero-CDN Native Stylesheet -->
  <link rel="stylesheet" href="/style.css?v=34">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Structured Data (JSON-LD) for Search Engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MovieTheater",
    "name": "Showcase Cinemas Belgrano",
    "url": "https://cartelerashowcasebelgrano.vercel.app/",
    "sameAs": "https://entradas.todoshowcase.com/showcase/",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Monroe 1750",
      "addressLocality": "Belgrano",
      "addressRegion": "Ciudad Autónoma de Buenos Aires",
      "postalCode": "C1428",
      "addressCountry": "AR"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": -34.5574,
      "longitude": -58.4526
    },
    "telephone": "+54 11 4788-0000",
    "priceRange": "$$",
    "currenciesAccepted": "ARS"
  }
  </script>
</head>
<body>

  <!-- Transparent overlay backdrop to shield clicks outside open dropdowns -->
  <div id="dropdownBackdrop" class="dropdown-backdrop" hidden aria-hidden="true"></div>

  <!-- Minimalist Clean Header (matches footer style) -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="brand-section">
          <div class="brand-icon-box" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
              <line x1="7" y1="2" x2="7" y2="22"></line>
              <line x1="17" y1="2" x2="17" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <line x1="2" y1="7" x2="7" y2="7"></line>
              <line x1="2" y1="17" x2="7" y2="17"></line>
              <line x1="17" y1="17" x2="22" y2="17"></line>
              <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
          </div>
          <div class="brand-info">
            <h1>Cartelera Showcase</h1>
          </div>
        </div>

        <!-- Cinema Selector Dropdown (Belgrano is default) -->
        <div class="cinema-selector-wrapper" id="dropdownCinemaWrapper">
          <button type="button" class="cinema-selector-btn" id="cinemaSelectorBtn" aria-expanded="false" aria-label="Seleccionar complejo Showcase">
            <span class="cinema-pin-icon" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
            <span class="cinema-current-name" id="currentCinemaName">Belgrano</span>
            <svg class="dropdown-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="cinema-menu" id="menuCinema">
            <!-- Populated dynamically via app.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- View Mode Segmented Control: Por fecha vs. Todas las películas -->
    <div class="view-mode-wrapper">
      <div class="container">
        <div class="view-mode-tabs" role="tablist" aria-label="Modo de visualización de cartelera">
          <button type="button" 
                  class="view-mode-tab is-active" 
                  id="modeDateBtn" 
                  role="tab" 
                  aria-selected="true" 
                  aria-controls="datesNavWrapper">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Por fecha</span>
          </button>
          <button type="button" 
                  class="view-mode-tab" 
                  id="modeAllBtn" 
                  role="tab" 
                  aria-selected="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="18" x="2" y="3" rx="2.5" ry="2.5"></rect>
              <line x1="2" y1="9" x2="22" y2="9"></line>
              <line x1="6.5" y1="3" x2="8.5" y2="9"></line>
              <line x1="12" y1="3" x2="14" y2="9"></line>
              <line x1="17.5" y1="3" x2="19.5" y2="9"></line>
            </svg>
            <span>Todas las películas</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Date selector horizontal tabs (non-sticky, scrolls naturally) -->
  <nav class="dates-nav-wrapper" id="datesNavWrapper" aria-label="Seleccionar fecha de funciones">
    <div class="container">
      <div class="dates-nav" id="dateTabs" role="tablist">
        <!-- Injected via app.js -->
      </div>
    </div>
  </nav>

  <!-- Filter & Search Toolbar -->
  <section class="toolbar-section" aria-label="Filtros y búsqueda">
    <div class="container">
      <div class="toolbar-grid">
        <!-- Search bar wrapped in semantic <search> element -->
        <search class="search-wrapper">
          <span class="search-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="search" 
                 id="searchInput" 
                 class="search-input" 
                 placeholder="Buscar película por título..." 
                 aria-label="Buscar película por título"
                 autocomplete="off" 
                 spellcheck="false">
          <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="Limpiar búsqueda" title="Limpiar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </search>

        <!-- Modern Filter Pills Row (Option 2: Airbnb / Flights dropdown pills) -->
        <div class="filter-pills-row">
          <!-- Dropdown 1: Idioma -->
          <div class="filter-dropdown-wrapper" id="dropdownLangWrapper">
            <button type="button" class="filter-pill-btn" id="pillLangBtn" aria-expanded="false">
              <span class="filter-pill-label" id="pillLangLabel">Idioma</span>
              <svg class="dropdown-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="filter-menu" id="menuLang">
              <button type="button" class="filter-menu-item is-selected" data-filter="language" data-val="all">
                <span>Todos los idiomas</span>
                <span class="filter-menu-check">✓</span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="language" data-val="sub">
                <span>Subtitulada</span>
                <span class="filter-menu-check"></span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="language" data-val="dob">
                <span>Doblada (Español)</span>
                <span class="filter-menu-check"></span>
              </button>
            </div>
          </div>

          <!-- Dropdown 2: Horario -->
          <div class="filter-dropdown-wrapper" id="dropdownTimeWrapper">
            <button type="button" class="filter-pill-btn" id="pillTimeBtn" aria-expanded="false">
              <span class="filter-pill-label" id="pillTimeLabel">Horario</span>
              <svg class="dropdown-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="filter-menu" id="menuTime">
              <button type="button" class="filter-menu-item is-selected" data-filter="timeBand" data-val="all">
                <span>Cualquier hora</span>
                <span class="filter-menu-check">✓</span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="timeBand" data-val="15">
                <span>Desde 15:00 hs</span>
                <span class="filter-menu-check"></span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="timeBand" data-val="18">
                <span>Desde 18:00 hs</span>
                <span class="filter-menu-check"></span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="timeBand" data-val="20">
                <span>Desde 20:00 hs</span>
                <span class="filter-menu-check"></span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="timeBand" data-val="22">
                <span>Desde 22:00 hs</span>
                <span class="filter-menu-check"></span>
              </button>
            </div>
          </div>

          <!-- Dropdown 3: Formato -->
          <div class="filter-dropdown-wrapper" id="dropdownFormatWrapper">
            <button type="button" class="filter-pill-btn" id="pillFormatBtn" aria-expanded="false">
              <span class="filter-pill-label" id="pillFormatLabel">Formato</span>
              <svg class="dropdown-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="filter-menu" id="menuFormat">
              <button type="button" class="filter-menu-item is-selected" data-filter="format" data-val="all">
                <span>2D y 3D</span>
                <span class="filter-menu-check">✓</span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="format" data-val="2d">
                <span>Solo 2D</span>
                <span class="filter-menu-check"></span>
              </button>
              <button type="button" class="filter-menu-item" data-filter="format" data-val="3d">
                <span>Solo 3D</span>
                <span class="filter-menu-check"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Movie Billboard Grid -->
  <main class="billboard-main">
    <div class="container">
      <div class="movie-grid" id="movieGrid" aria-live="polite">
        <!-- Injected via app.js -->
      </div>

      <!-- Stats Bar (Abajo de todo) -->
      <div class="stats-banner" aria-live="polite">
        <div id="resultsCount">Consultando cartelera oficial...</div>
        <div class="stats-disclaimer">Las funciones pasadas no se muestran</div>
      </div>
    </div>
  </main>

  <!-- Movie Detail Modal / Sheet (Native <dialog> with Top-Layer & Inert) -->
  <dialog id="movieModal" class="modal-dialog" aria-labelledby="modalMovieTitle">
    <div class="modal-content" tabindex="-1" autofocus>
      <div class="sheet-handle" aria-hidden="true"></div>
      <button type="button" id="modalCloseBtn" class="modal-close-btn" aria-label="Cerrar ficha">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-body" id="modalBody">
        <!-- Injected dynamically on click -->
      </div>
    </div>
  </dialog>

  <!-- Clean Minimalist Footer (Dynamic to selected cinema) -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-meta">
          <strong id="footerCinemaName">Showcase Belgrano</strong>
          <span id="footerCinemaAddress">Monroe 1750, Ciudad Autónoma de Buenos Aires • Horarios oficiales</span>
        </div>
        <div class="footer-links">
          <a href="https://entradas.todoshowcase.com/showcase/" target="_blank" rel="noopener noreferrer" class="footer-link">Sitio oficial Showcase</a>
          <a href="https://www.google.com/maps/search/?api=1&query=Showcase+Cinemas+Belgrano+Monroe+1750" target="_blank" rel="noopener noreferrer" id="footerMapsLink" class="footer-link">Cómo llegar (Google Maps)</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/app.js?v=34" defer></script>

  <!-- Vercel Web Analytics & Speed Insights (Production) -->
  <script>
    if (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
      // Official Vercel Web Analytics tracker
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      const va = document.createElement('script');
      va.defer = true;
      va.src = 'https://va.vercel-scripts.com/v1/script.js';
      document.head.appendChild(va);

      // Official Vercel Speed Insights tracker
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
      const si = document.createElement('script');
      si.defer = true;
      si.src = '/_vercel/speed-insights/script.js';
      document.head.appendChild(si);
    }
  </script>
</body>
</html>
